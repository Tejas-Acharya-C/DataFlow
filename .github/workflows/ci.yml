name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dataflow_ci
          POSTGRES_USER: dataflow
          POSTGRES_PASSWORD: dataflow_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint Checks
        run: |
          ruff check src tests

      - name: Run Database Migrations
        env:
          DATAFLOW_DATABASE_URL: postgresql+psycopg://dataflow:dataflow_password@localhost:5432/dataflow_ci
        run: |
          alembic upgrade head

      - name: Run Backend Tests
        env:
          DATAFLOW_DATABASE_URL: postgresql+psycopg://dataflow:dataflow_password@localhost:5432/dataflow_ci
          REQUIRE_POSTGRES_TEST: "1"
        run: |
          pytest -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
